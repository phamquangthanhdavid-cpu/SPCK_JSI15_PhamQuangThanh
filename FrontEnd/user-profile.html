<!DOCTYPE html>
<html lang="vi">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title fs-3>LaptopStore</title fs-3>
  <link rel="stylesheet" href="style/home.css">

  <!-- Firebase -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/firebase/12.16.0/firebase-app-compat.min.js"
    integrity="sha512-gCJuoyvPlJMaTPkYPfyfEt1KYPvoEE9PgGHlOU+Qtg+kLbBfEbiiim4PDj2ATWLc6BN0irZnNbdgzCtX53vjXQ=="
    crossorigin="anonymous" referrerpolicy="no-referrer"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/firebase/12.16.0/firebase-firestore-compat.min.js"
    integrity="sha512-Xxpv+NpwNyir+77oEME5XeixRoRLrI4eY0bBZSMHgWLEFbc0f+JP4Nax3t/qDuYg1hgWrSl8pUapb+AO5Lp1jA=="
    crossorigin="anonymous" referrerpolicy="no-referrer"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/firebase/12.16.0/firebase-storage-compat.min.js"
    integrity="sha512-l/ieVoEShBQI9lKOdMY4AAV9rzEE5YHKF8XB4m3Qn3DtK9AhYSOgyDWrL2XH1lhKS4Fde+PNoDiBoT7UhcP23A=="
    crossorigin="anonymous" referrerpolicy="no-referrer"></script>

  <!-- Firebase Authentication -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/firebase/12.16.0/firebase-auth-compat.min.js"
    integrity="sha512-PgwIBKz/MWPvQvKq7MUWB5x5aCyiiXTnAtbUGqbBvylcD/oASXh8wap5g1lWpzPmNraLXWzuWx8bkZ+reKYoyQ=="
    crossorigin="anonymous" referrerpolicy="no-referrer"></script>

  <!-- Firebase configuration script -->
  <script src="./script/firebase-config.js"></script>

  <!-- CSS -->
  <link rel="stylesheet" href="./style/style.css">
  <link rel="stylesheet" href="./style/user-profile.css">

  <!-- Bootstrap -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet"
    integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
  <script src="https://cdn.jsdelivr.net/npm/@popperjs/core@2.11.8/dist/umd/popper.min.js"
    integrity="sha384-I7E8VVD/ismYTF4hNIPjVp/Zjvgyol6VFvRkX/vR+Vc4jQkC+hVqc2pM8ODewa9r"
    crossorigin="anonymous"></script>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.min.js"
    integrity="sha384-G/EV+4j2dNv+tEPo3++6LCgdCROaejBqfUeNjuKAiuXbjrxilcCdDz6ZAVfHWe1Y"
    crossorigin="anonymous"></script>

  <!-- Font Awesome -->
  <script src="https://kit.fontawesome.com/b47a1c1ea4.js" crossorigin="anonymous"></script>

</head>

<body>
  <div class="navbar">
    <div class="container navbar-inner">
      <a href="./home.html">
        <div class="logo">LaptopStore</div>
      </a>



      <div class="buttons">
        <a id="login" href="./login.html">Login</a>
        <a class="ms-3" id="register" href="./register.html">Register</a>

        <a href="./shopping-cart.html" class="ms-3" id="btn-cart" style="display: none;"><i
            class="fa-solid fa-cart-shopping"></i></a>

        <div class="dropdown ms-3" id="user-dropdown" style="display: none;">
          <button class="btn btn-secondary dropdown-toggle" type="button" id="dropdownMenuButton"
            data-bs-toggle="dropdown" aria-expanded="false">
            <span id="user-name">User</span>
          </button>
          <ul class="dropdown-menu" aria-labelledby="dropdownMenuButton">
            <li><a class="dropdown-item" href="./user-profile.html">Profile</a></li>
            <li><a class="dropdown-item" href="./order-history.html">Order History</a></li>
            <li><a class="dropdown-item" href="#" id="logout">Logout</a></li>
          </ul>
        </div>
      </div>
    </div>
  </div>

  <div class="container mt-5 mb-5">
    <div class="row">
      <div class="col-md-4 d-flex justify-content-center align-items-center">
        <img id="user-avatar" src="./asset/avatar-default.svg" alt="User Avatar" class="img-fluid rounded-circle mb-3">
      </div>
      <div class="col-md-8">
        <div class="card mt-4">
          <div class="card-body">
            <div class="d-flex justify-content-between align-items-center mb-3">
              <h5 class="card-title">User Information</h5>
              <div>
                <button type="submit" class="btn btn-success" id="save-profile-btn" style="display: none;">Save</button>
                <button type="submit" class="btn btn-secondary" id="cancel-profile-btn"
                  style="display: none;">Cancel</button>
                <button class="btn btn-primary" id="edit-profile-btn"><i class="fa-solid fa-pen-to-square"></i></button>
              </div>
            </div>
            <div class="mb-3">
              <label for="user-email-input" class="form-label">Email</label>
              <input type="email" class="form-control" id="user-email-input" disabled>
            </div>
            <div class="mb-3">
              <label for="user-name-input" class="form-label">Name</label>
              <input type="text" class="form-control" id="user-name-input" disabled>
              <div class="invalid-feedback m-0">
                Name is required.
              </div>
            </div>
            <div class="mb-3">
              <label for="user-phone-input" class="form-label">Phone</label>
              <input type="text" class="form-control" id="user-phone-input" disabled>
              <div class="invalid-feedback m-0">
                Phone is required.
              </div>
            </div>
            <div class="mb-3">
              <label for="user-phone-input" class="form-label">Address</label>
              <input type="text" class="form-control" id="user-address-input" disabled>
              <div class="invalid-feedback m-0">
                Address is required.
              </div>
            </div>
          </div>
        </div>
      </div>

    </div>

  </div>

  <div class="footer">
    <div class="container footer-inner">
      <div>
        <h3>LaptopStore</h3>
        <p>Địa chỉ: 123 Đường ABC, Quận XYZ, TP.HCM</p>
        <img src="./assets/home/bct.png" alt="">
      </div>

      <div>
        <h3>Liên hệ</h3>
        <p>Hotline: 0123456789</p>
      </div>
    </div>
  </div>

  <script src="./script/user-profile.js"></script>
</body>

</html>
