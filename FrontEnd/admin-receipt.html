<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Admin - Receipt</title>
  <link rel="stylesheet" href="./style/style.css">
  <link rel="stylesheet" href="./style/admin.css">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css">
  <script src="https://cdnjs.cloudflare.com/ajax/libs/firebase/12.16.0/firebase-app-compat.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/firebase/12.16.0/firebase-firestore-compat.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/firebase/12.16.0/firebase-auth-compat.min.js"></script>
  <script src="./script/firebase-config.js"></script>
  <script src="./script/navbar-check.js"></script>
  <script src="./script/admin-receipt.js"></script>
</head>
<body>
  <div class="navbar">
    <div class="container navbar-inner">
      <a href="./home.html"><div class="logo">LaptopStore</div></a>
      <div class="buttons">
        <a id="login" href="./login.html">Login</a>
        <a id="register" href="./register.html">Register</a>
        <div class="dropdown ms-3" id="user-dropdown" style="display:none;">
          <button class="btn btn-secondary dropdown-toggle" type="button" data-bs-toggle="dropdown"><span id="user-name">Admin</span></button>
          <ul class="dropdown-menu"><li><a class="dropdown-item" href="#" id="logout">Logout</a></li></ul>
        </div>
      </div>
    </div>
  </div>

  <div class="admin-layout">
    <aside class="admin-sidebar" aria-label="Admin navigation">
      <a href="./admin.html"><div class="admin-sidebar-title"><span>Admin Pannel</span></div></a>
      <nav class="admin-nav">
        <a class="admin-nav-link" href="./admin.html"><i class="fa-solid fa-box"></i><span>Product</span></a>
        <a class="admin-nav-link active" href="./admin-receipt.html"><i class="fa-solid fa-receipt"></i><span>Receipt</span></a>
      </nav>
    </aside>
    <main class="admin-main">
      <section class="container mt-5">
        <div class="d-flex justify-content-between align-items-center mb-3">
          <h1>Receipts</h1>
          <span id="receipt-count" class="text-secondary"></span>
        </div>
        <div id="receipt-message" class="text-secondary">Loading receipts...</div>
        <div id="receipt-list" class="table-responsive"></div>
      </section>
    </main>
  </div>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>
  <script src="https://kit.fontawesome.com/b47a1c1ea4.js" crossorigin="anonymous"></script>
</body>
</html>
