<body>
  <div class="navbar">
    <div class="container navbar-inner">
      <a href="./home.html">
        <div class="logo">LaptopStore</div>
      </a>
      <div class="buttons">
        <a id="login" href="./login.html">Login</a>
        <a class="ms-3" id="register" href="./register.html">Register</a>

        <a href="./shopping-cart.html" class="ms-3" id="btn-cart" style="display: none;"><i
            class="fa-solid fa-cart-shopping"></i></a>

        <div class="dropdown ms-3" id="user-dropdown" style="display: none;">
          <button class="btn btn-secondary dropdown-toggle" type="button" id="dropdownMenuButton"
            data-bs-toggle="dropdown" aria-expanded="false">
            <span id="user-name">User</span>
          </button>
          <ul class="dropdown-menu" aria-labelledby="dropdownMenuButton">
            <li><a class="dropdown-item" href="./user-profile.html">Profile</a></li>
            <li><a class="dropdown-item" href="./order-history.html">Order History</a></li>
            <li><a class="dropdown-item" href="#" id="logout">Logout</a></li>
          </ul>
        </div>
      </div>
    </div>
  </div>
  <!-- Content -->
  <div class="container my-5" style="max-width: 900px;">
    <div class="d-flex align-items-baseline justify-content-between mb-4">
      <h2 class="mb-0">Lịch sử đơn hàng</h2>
      <span class="text-secondary" id="order-count"></span>
    </div>
 
    <!-- Loading, empty, and error states all render here -->
    <div id="order-message" class="text-secondary">Đang tải đơn hàng...</div>
 
    <div class="accordion" id="order-list"></div>
  </div>


  <div class="footer">
    <div class="container footer-inner">
      <div>
        <h3>LaptopStore</h3>
        <p>Địa chỉ: 123 Đường ABC, Quận XYZ, TP.HCM</p>
        <img src="./assets/home/bct.png" alt="">
      </div>

      <div>
        <h3>Liên hệ</h3>
        <p>Hotline: 0123456789</p>
      </div>
    </div>
  </div>
