<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Chi tiet san pham</title>

    <!-- Firebase -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/firebase/12.16.0/firebase-app-compat.min.js"
        integrity="sha512-gCJuoyvPlJMaTPkYPfyfEt1KYPvoEE9PgGHlOU+Qtg+kLbBfEbiiim4PDj2ATWLc6BN0irZnNbdgzCtX53vjXQ=="
        crossorigin="anonymous" referrerpolicy="no-referrer"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/firebase/12.16.0/firebase-firestore-compat.min.js"
        integrity="sha512-Xxpv+NpwNyir+77oEME5XeixRoRLrI4eY0bBZSMHgWLEFbc0f+JP4Nax3t/qDuYg1hgWrSl8pUapb+AO5Lp1jA=="
        crossorigin="anonymous" referrerpolicy="no-referrer"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/firebase/12.16.0/firebase-auth-compat.min.js"
        integrity="sha512-PgwIBKz/MWPvQvKq7MUWB5x5aCyiiXTnAtbUGqbBvylcD/oASXh8wap5g1lWpzPmNraLXWzuWx8bkZ+reKYoyQ=="
        crossorigin="anonymous" referrerpolicy="no-referrer"></script>
    <script src="./script/firebase-config.js"></script>
    <script src="./script/navbar-check.js"></script>

    <!-- Bootstrap -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <script src="https://cdn.jsdelivr.net/npm/@popperjs/core@2.11.8/dist/umd/popper.min.js"
        integrity="sha384-I7E8VVD/ismYTF4hNIPjVp/Zjvgyol6VFvRkX/vR+Vc4jQkC+hVqc2pM8ODewa9r"
        crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.min.js"
        integrity="sha384-G/EV+4j2dNv+tEPo3++6LCgdCROaejBqfUeNjuKAiuXbjrxilcCdDz6ZAVfHWe1Y"
        crossorigin="anonymous"></script>

    <!-- Font Awesome -->
    <script src="https://kit.fontawesome.com/b47a1c1ea4.js" crossorigin="anonymous"></script>

    <link rel="stylesheet" href="./style/detail.css">
</head>
<body>

    <div class="navbar">
    <div class="container navbar-inner">
      <a href="./home.html"><div class="logo">LaptopStore</div></a>

      <div class="buttons">
        <a id="login" href="./login.html">Login</a>
        <a class="ms-3" id="register" href="./register.html">Register</a>

        <a href="./shopping-cart.html" class="ms-3" id="btn-cart" style="display: none;"><i
            class="fa-solid fa-cart-shopping"></i></a>

        <div class="dropdown ms-3" id="user-dropdown" style="display: none;">
          <button class="btn btn-secondary dropdown-toggle" type="button" id="dropdownMenuButton"
            data-bs-toggle="dropdown" aria-expanded="false">
            <span id="user-name">User</span>
          </button>
          <ul class="dropdown-menu" aria-labelledby="dropdownMenuButton">
            <li><a class="dropdown-item" href="./user-profile.html">Profile</a></li>
            <li><a class="dropdown-item" href="./order-history.html">Order History</a></li>
            <li><a class="dropdown-item" href="#" id="logout">Logout</a></li>
          </ul>
        </div>
      </div>
    </div>
  </div>

    <div class="detail-page">
        <section class="detail-card">
            <div class="detail-image-wrap">
                <img data-product-image src="./assets/home/vanphong/lenovo_thinkbook.jpg" alt="San pham">
            </div>

            <div class="detail-content">
                <p class="detail-category">Chi Tiết Sản Phẩm</p>
                <h1 data-product-name>Sản Phẩm</h1>
                <p class="detail-price" data-product-price>Liên Hệ: 0123456789</p>

                <p class="detail-description" data-product-description>
                    Đây là một sản phẩm chất lượng cao.
                </p>

                <div class="detail-actions">
                    <button id="add-to-cart" type="button" class="add-btn btn-add-to-cart">Thêm vào giỏ hàng</button>
                    <a class="view-btn" href="./home.html">Xem thêm sản phẩm khác</a>
                </div>
            </div>
        </section>
    </div>


    <button id="chatBtn">💬</button>

    <!-- Khung chat -->
    <div id="chatBox" class="chatbox">
        <iframe
        src="https://www.chatbase.co/chatbot-iframe/wxEb1p5TK3gYDEt0VVphY"
        frameborder="0"
        allow="microphone"
        ></iframe>
    </div>

    <div class="footer">
    <div class="container footer-inner">
      <div>
        <h3>LaptopStore</h3>
        <p>Địa chỉ: 123 Đường ABC, Quận XYZ, TP.HCM</p>
        <img src="./assets/home/bct.png" alt="">
      </div>

      <div>
        <h3>Liên hệ</h3>
        <p>Hotline: 0123456789</p>
      </div>
    </div>

    </div>

    <script>
        const chatBtn = document.getElementById("chatBtn");
        const chatBox = document.getElementById("chatBox");

        chatBtn.addEventListener("click", () => {
            chatBox.classList.toggle("show");
        });
    </script>
    <script src="./script/detail.js"></script>
    <script src="./script/buy-product.js"></script>
</body>
</html>
