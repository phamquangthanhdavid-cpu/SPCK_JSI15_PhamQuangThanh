    <section class="container mt-5">
        <div class="d-flex justify-content-between align-items-center mb-3">
            <h1 class="mb-3">Products</h1>
            <button class="btn btn-primary mb-3" id="btn-add-product" data-bs-toggle="modal"
                data-bs-target="#addProductModal">
                <i class="fa-solid fa-plus"></i> Add Product
            </button>
        </div>

        <div id="products-container">
            <!-- inner sản phẩm vào đây -->
        </div>
    </section>

    <!-- Modal -->
    <div class="modal fade" id="addProductModal" tabindex="-1" aria-labelledby="exampleModalLabel" aria-hidden="true">
        <div class="modal-dialog">
            <div class="modal-content">
                <div class="modal-header">
                    <h5 class="modal-title" id="exampleModalLabel">Add Product</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
                </div>
                <div class="modal-body">
                    <div class="mb-3">
                        <label for="product-name" class="form-label">Product Name <span class="text-danger">*</span></label>
                        <input type="text" class="form-control" id="product-name" placeholder="Enter product name">
                    </div>

                    <div class="mb-3">
                        <label for="product-price" class="form-label">Price <span class="text-danger">*</span></label>
                        <input type="number" class="form-control" id="product-price" placeholder="Enter product price"
                            step="0.01">
                    </div>

                    <div class="mb-3">
                        <label for="product-stock" class="form-label">Stock<span class="text-danger">*</span></label>
                        <input type="number" class="form-control" id="product-stock" placeholder="Enter product stock"
                            step="1">
                    </div>

                    <div class="mb-3">
                        <label for="product-category" class="form-label">Category <span class="text-danger">*</span></label>
                        <input type="text" class="form-control" id="product-category" placeholder="Enter product category">
                    </div>

                    <div class="mb-3">
                        <label for="product-description" class="form-label">Product Description <span class="text-danger">*</span></label>
                        <textarea class="form-control" id="product-description" rows="3"></textarea>
                    </div>

                    <div class="mb-3">
                        <label for="product-image" class="form-label">Product Image <span class="text-danger">*</span></label>
                        <input class="form-control" type="file" id="product-image" accept="image/*">
                    </div>

                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Close</button>
                    <button type="button" class="btn btn-primary" id="btn-save-product">Save changes</button>
                </div>
            </div>
        </div>
    </div>
